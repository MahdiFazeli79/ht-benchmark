[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "htbench"
version = "0.1.0"
description = "Enforcement machinery for the dual-abstraction hardware-Trojan benchmark (schema, validator, round-trip gate)."
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.0"]

[project.optional-dependencies]
# Reference RTL extractor + round-trip gate.
extract = ["pyverilog>=1.3"]
# HW2VEC torch_geometric downstream view.
hw2vec = ["torch", "torch-geometric"]
# Circuit-list gate (check-list) reads a YAML manifest.
manifest = ["pyyaml>=6.0"]
# Phase-2 insertion engine: the paid LLM client.
insertion = ["anthropic>=0.40"]

[project.scripts]
htbench = "htbench.cli:main"
htbench-scan-secrets = "htbench.secret_scan:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["htbench*"]
