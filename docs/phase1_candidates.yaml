  - variant_group: core_existing
    circuit_family: mixed_small
    source: "date2027 CORE corpus (LLM-generated, Mahdi-owned)"
    license: CC-BY-4.0     # assign permissive; Mahdi owns the generated RTL
    language: verilog
    parse_path: verilog_direct
    bin: xs               # the existing 50-circuit clean set; xs/s
    note: reuse existing clean CORE designs; HW2VEC/GHOST/TrustHub need per-source license check

  # =========================================================================
  # BRANCH-A EXPANSION (2026-06-10, added unattended) — attacks the 87%
  # homogeneity by adding permissive NON-RISCV / NON-OpenTitan IP (crypto,
  # comms, bus fabric, DSP/ML accel, NoC). Licenses below are from project
  # KNOWLEDGE, NOT verified against the repo LICENSE file — the download gate
  # and Mahdi must re-verify each before any clone. `unconfirmed` => R10-blocked.
  # Honest result: this fixes homogeneity but barely moves the l-floor, which
  # confirms the review's thesis that permissive LARGE independent designs are
  # genuinely scarce (Branch-B finding).
  # =========================================================================

  # --- large (l) non-CPU / diversifying ---
  - variant_group: corundum
    circuit_family: ethernet_nic
    source: "github:ucsdsysnet/corundum"
    license: BSD-2-Clause        # project-knowledge; verify LICENSE at clone
    language: systemverilog
    parse_path: sv2v
    bin: l
    proxy_loc: ">40k"
    r9_canary: true              # large SV NIC datapath — deep hierarchy
    note: license from knowledge; verify at clone
  - variant_group: gemmini
    circuit_family: ml_accelerator
    source: "github:ucb-bar/gemmini"
    license: BSD-3-Clause        # Berkeley/Chipyard; verify at clone
    language: chisel_gen
    parse_path: chisel_gen       # generated Verilog; $-names -> R9 risk
    bin: l
    proxy_loc: ">15k"
    note: non-CPU large accel; license from knowledge
  - variant_group: black_parrot
    circuit_family: riscv_cpu
    source: "github:black-parrot/black-parrot"
    license: BSD-3-Clause        # verify at clone
    language: systemverilog
    parse_path: sv2v
    bin: l
    proxy_loc: ">20k"
    note: adds an l-bin distinct group (still riscv_cpu, helps floor not homogeneity)
  - variant_group: openpiton
    circuit_family: noc_tile
    source: "github:PrincetonUniversity/openpiton"
    license: unconfirmed         # likely BSD-3 / Solderpad mix — BLOCKED until checked
    language: verilog
    parse_path: verilog_direct
    bin: l
    note: NoC + tile, strong l + diversity candidate; license must be confirmed

