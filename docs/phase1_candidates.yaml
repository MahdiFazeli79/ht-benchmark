# Phase-1 candidate circuit list (PRE-DOWNLOAD, for review). Nothing ingested.
# Two intake dimensions per row: LICENSE (R10) and LANGUAGE/parse-path.
# parse_path: verilog_direct | sv2v (SystemVerilog->Verilog via sv2v, MIT) |
#             chisel_gen (generated Verilog, messy names) | EXCLUDE
# status: candidate | reject (with reason). l-bin sourced first.
# bin/proxy are pre-extraction estimates (RTL LOC); true bin is post-extraction.

meta:
  benchmark_data_license: CC-BY-4.0
  note: First-pass list. Licenses marked 'unconfirmed' = reject under R10 until the
        repo LICENSE file is checked. This list is the reviewable artifact; the
        download boundary is NOT crossed.

# ---------------------------------------------------------------------------
# l-bin candidates (>10k nodes), sourced FIRST. Floor: >=100 samples across
# >=25 distinct variant_group.
# ---------------------------------------------------------------------------
candidates:
  - variant_group: cva6
    circuit_family: riscv_cpu
    source: "github:openhwgroup/cva6"
    license: Solderpad-2.1
    language: systemverilog
    parse_path: sv2v
    bin: l
    proxy_loc: ">20k"
    r9_canary: true        # 64-bit core, deep hierarchy + packages
  - variant_group: openc910
    circuit_family: riscv_cpu
    source: "github:XUANTIE-RV/openc910"
    license: Apache-2.0
    language: verilog
    parse_path: verilog_direct
    bin: l
    proxy_loc: ">30k"
    r9_canary: true
  - variant_group: veer_eh1
    circuit_family: riscv_cpu
    source: "github:chipsalliance/Cores-VeeR-EH1"
    license: Apache-2.0
