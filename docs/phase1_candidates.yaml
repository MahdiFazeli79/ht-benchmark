rejected:
  - name: ITC-99 (I99T)
    source: "github:cad-polito-it/I99T"
    reason: "R10 license — CC-BY-SA-4.0 / EUPL-1.2 (copyleft, incompatible with CC-BY)"
  - name: ISCAS-85
    source: academic mirrors (NCSU)
    reason: "R10 license — no formal license (unconfirmed); also .bench netlist not synthesizable RTL"
  - name: ISCAS-89
    source: academic mirrors
    reason: "R10 license — unconfirmed; netlist format"
  - name: OpenCores AES128 / SHA cores / AES-128 pipelined
    source: opencores.org
    reason: "R10 license — LGPL (copyleft)"
  - name: NEORV32
    source: "github:stnolting/neorv32"
    reason: "language — VHDL, not supported by the Pyverilog/Verilog pipeline (license BSD-3 is fine)"
